[project]
name = "paperflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "sqlalchemy", "alembic", "pydantic-settings", "python-multipart", "pypdf", "httpx", "beautifulsoup4", "bleach", "defusedxml", "pillow", "psutil"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
